# keyd remaps for macOS-style line navigation on GNOME/Wayland.
# Applies to all keyboards ([ids] *).
#
# Layer order is load-bearing: composite layers ([control+alt]) MUST be
# defined AFTER their constituent layers ([alt]). keyd otherwise silently
# ignores the composite layer.

[ids]
*

# Alt+Left/Right → Home/End (macOS Cmd+Left/Right line jump).
# Ctrl+Left/Right word movement is left native.
[alt]
left  = home
right = end

# Preserve GNOME Ctrl+Alt+Left/Right workspace switching.
# Without this layer, [alt] swallows those combos.
# C-A- prefix is required: composite layers strip constituent modifiers.
[control+alt]
left  = C-A-left
right = C-A-right
